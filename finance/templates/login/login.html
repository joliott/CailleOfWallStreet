{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-4 mt-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-wallet2 text-success" style="font-size: 3rem;"></i>
                    <h2 class="h4 mt-3 fw-bold">Connexion</h2>
                    <p class="text-muted">Accédez à votre espace</p>
                </div>

                {% if erreur %}
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>{{ erreur }}</div>
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">Nom d'utilisateur</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Votre identifiant" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                        Se connecter
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
