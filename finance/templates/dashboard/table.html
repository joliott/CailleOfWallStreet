<div id="operations-table" class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="px-4 py-3">Nom de l'opération</th>
                        <th class="px-4 py-3">Personne</th>
                        <th class="px-4 py-3 text-end">Montant</th>
                    </tr>
                </thead>
                <tbody id="corps-tableau">
                    {% for operation in operations %}
                    <tr>
                        <td class="px-4 py-3 align-middle fw-medium">{{ operation.name }}</td>
                        <td class="px-4 py-3 align-middle">
                            <i class="bi bi-person-circle text-secondary me-2"></i>{{ operation.user.username }}
                        </td>
                        <td class="px-4 py-3 align-middle text-end fw-bold {% if operation.type == 'd' %}text-danger{% else %}text-success{% endif %}">
                            {% if operation.type == 'd' %}-{% else %}+{% endif %}{{ operation.price }} €
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-4">Aucune opération trouvée.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
